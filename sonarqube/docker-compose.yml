# Local SonarQube Community Build for the demo.
#   Start:  docker compose -f sonarqube/docker-compose.yml up -d
#   Stop:   docker compose -f sonarqube/docker-compose.yml stop
#   Reset:  docker compose -f sonarqube/docker-compose.yml down -v   (deletes all analyses)
# shortcut: embedded H2 database, evaluation only and no upgrades; add PostgreSQL for real use.
services:
  sonarqube:
    image: sonarqube:26.11.0.134175-community
    ports:
      # Only this PC can reach it: the first login is admin/admin.
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
